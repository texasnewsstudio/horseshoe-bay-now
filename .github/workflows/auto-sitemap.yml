name: Automatic sitemap update
on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'scripts/generate_sitemap.py'
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate sitemap
        run: python3 scripts/generate_sitemap.py
      - name: Commit changed sitemap
        run: |
          if ! git diff --quiet -- sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "Auto-update sitemap"
            git push
          fi
